<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoAgentX Studio</title>
    <!-- Inline, so the browser never asks the server for /favicon.ico. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ccircle cx='10' cy='11' r='3.5' fill='white'/%3E%3Ccircle cx='22' cy='11' r='3.5' fill='white'/%3E%3Ccircle cx='16' cy='22' r='3.5' fill='white'/%3E%3Cpath d='M10 11L16 22L22 11' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so a dark session does not
      // flash the light palette on load.
      try {
        var t = localStorage.getItem('evoagentx-studio:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
